<body>

<main id="home">
  <div class="mascot" id="homeRev" aria-hidden="true"></div>
  <h1>Talking Rev</h1>
  <p class="lead">Bantu Rev makan, minum, dan minum obat!</p>
  <button class="btn big" id="startBtn">Main! ▶</button>
  <div class="stars" id="starsHome">⭐ 0 bintang</div>
  <p class="back"><a href="../">← Taman Bermain</a></p>
  <p class="credit">Dibuat oleh <a href="https://indrakusuma.dev" rel="author">Indra Kusuma</a></p>
</main>

<section id="play" aria-label="Main" tabindex="-1">
  <div class="hud">
    <button class="round" id="homeBtn" aria-label="Kembali ke awal">🏠</button>
    <div class="counter" id="counter"></div>
    <button class="round" id="talkBtn" aria-label="Bicara, Rev menirukan suaramu">🎤</button>
  </div>

  <div class="talk">
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </div>

  <div class="stage">
    <div class="rev-wrap" id="revWrap">
      <div id="rev"></div>
      <button class="hit head" id="hitHead" aria-label="Elus kepala Rev"></button>
      <button class="hit belly" id="hitBelly" aria-label="Colek perut Rev"></button>
    </div>
  </div>

  <div class="bar tray" id="tray"></div>

  <div class="bar listen">
    <div class="level" id="level" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <button class="micbig" id="micBtn" aria-label="Selesai bicara">🎤</button>
    <div class="hint">Ayo bicara! Ketuk lagi kalau sudah.</div>
  </div>

  <div class="sheet" id="winSheet">
    <div class="panel">
      <div class="win-rev" id="winRev" aria-hidden="true"></div>
      <h2>Hore, Rev sehat!</h2>
      <p>Rev sudah kenyang, segar, dan sembuh. Kamu dapat 1 bintang!</p>
      <button class="btn" id="againBtn">Main lagi</button>
      <button class="btn alt" id="doneBtn">Selesai</button>
    </div>
  </div>
</section>

<script defer src="assets/js/rev.js"></script>
<script defer src="assets/js/game.js"></script>
</body>
</html>
