<main id="home">
  <div class="mascot" aria-hidden="true"><span class="fc fa">A</span><span class="fc fb">B</span><span class="fc f3">3</span></div>
  <h1>Huruf &amp; Angka</h1>
  <p class="lead">Yuk kenalan sama huruf &amp; angka!</p>
  <div class="modes">
    <button class="mode m1" data-set="huruf" data-game="tebak"><span class="ico" aria-hidden="true">🔤</span><b>Tebak Huruf</b></button>
    <button class="mode m2" data-set="angka" data-game="tebak"><span class="ico" aria-hidden="true">🔢</span><b>Tebak Angka</b></button>
    <button class="mode m3" data-set="huruf" data-game="urut"><span class="ico" aria-hidden="true">🧩</span><b>Urutkan Huruf</b></button>
    <button class="mode m4" data-set="angka" data-game="urut"><span class="ico" aria-hidden="true">🧩</span><b>Urutkan Angka</b></button>
  </div>
  <div class="stars" id="starsHome">⭐ 0 bintang</div>
  <p class="note">Untuk ayah dan bunda: satu ronde berisi 5 soal tanpa batas waktu. Nyalakan suara HP, karena soalnya dibacakan. Tingkat kesulitan menyesuaikan sendiri.</p>
  <p class="back"><a href="../">← Taman Bermain</a></p>
  <p class="credit">Dibuat oleh <a href="https://indrakusuma.dev" rel="author">Indra Kusuma</a></p>
</main>

<section id="play" aria-label="Main">
  <div class="hud">
    <button class="round" id="homeBtn" aria-label="Kembali ke awal">🏠</button>
    <div class="dots" id="dots" aria-label="Soal"></div>
    <button class="round" id="speakBtn" aria-label="Ulangi suara">🔊</button>
  </div>
  <div class="board">
    <p class="ask" id="ask" aria-live="polite"></p>
    <div class="slots" id="slots"></div>
    <div class="cards" id="cards"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="sheet" id="winSheet">
    <div class="panel">
      <div class="big">🌟</div>
      <h2>Hore, hebat!</h2>
      <p id="winText">Kamu dapat 1 bintang!</p>
      <button class="btn" id="againBtn">Main lagi</button>
      <button class="btn alt" id="doneBtn">Selesai</button>
    </div>
  </div>
</section>
